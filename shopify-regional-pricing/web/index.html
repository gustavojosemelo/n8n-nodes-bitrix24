<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Precificação Regional</title>
    <!--
      App Bridge precisa ser o primeiro script da página e carregado direto do
      CDN da Shopify. data-api-key é substituído no build pelo valor de
      VITE_SHOPIFY_API_KEY.
    -->
    <script
      src="https://cdn.shopify.com/shopifycloud/app-bridge.js"
      data-api-key="%VITE_SHOPIFY_API_KEY%"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
