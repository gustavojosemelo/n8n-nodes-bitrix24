# Configuracao do app custom. Usada pelo Shopify CLI para publicar a
# theme app extension (`shopify app deploy`). O backend roda na VPS via
# Coolify, entao nao ha `dev_store_url` nem build web aqui.

name = "Precificacao Regional"
handle = "regional-pricing"
client_id = "SUBSTITUA_PELO_CLIENT_ID_DO_PARTNERS"
application_url = "https://app.seudominio.com.br"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_orders"

[auth]
redirect_urls = [
  "https://app.seudominio.com.br/auth/callback"
]

[webhooks]
api_version = "2025-10"

[app_proxy]
url = "https://app.seudominio.com.br/proxy"
subpath = "regional-pricing"
prefix = "apps"

[build]
include_config_on_deploy = true
